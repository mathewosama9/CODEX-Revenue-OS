name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Tests run on the same database as production (ADR-003), so the isolation suite is real.
    services:
      pgsql:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: codex_testing
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: secret
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready -U codex -d codex_testing"
          --health-interval 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 54320
      DB_DATABASE: codex_testing
      DB_USERNAME: codex
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Enable database extensions
        run: PGPASSWORD=secret psql -h 127.0.0.1 -p 54320 -U codex -d codex_testing -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Setup Application
        run: composer setup

      # Includes: vp check, tsc, RTL check, Pint, PHPStan, and Pest (Unit, Feature, Isolation, Arch).
      - name: Run CI Checks
        run: composer ci:check
