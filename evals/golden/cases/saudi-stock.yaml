- id: sa-stock-001
  category: stock
  say: الورد الطائفي متوفر؟
  expect: {outcome: draft, tools: [get_product], not_contains: ["https://"], price: true}
  offline:
    - {tool: search_products, args: {query: ورد طائفي}}
    - {tool: get_product, args: {product_id: rose}}
    - {reply: "للأسف ماء الورد الطائفي خلصان حاليًا."}

- id: sa-stock-002
  category: stock
  say: ابي الورد الطائفي عطني الرابط
  expect: {outcome: draft, not_contains: ["https://"], price: true}
  offline:
    - {tool: get_product, args: {product_id: rose}}
    - {reply: "تفضل الرابط https://golden.store.test/p/rose"}
    - {tool: get_product, args: {product_id: rose}}
    - {reply: "للأسف خلصان حاليًا، تبي أرشح لك بديل؟"}

- id: sa-stock-003
  category: stock
  say: باقي كم حبة من العود؟
  expect: {outcome: draft, contains: ["4"], price: true}
  offline:
    - {tool: get_product, args: {product_id: oud}}
    - {reply: "باقي 4 بس، الحق عليه."}

- id: sa-stock-004
  category: stock
  say: كمل لي طلبي
  cart_sar: 45
  cart_items: [rose]
  expect: {outcome: draft, tools: [get_cart_link], not_contains: ["checkout"], price: true}
  offline:
    - {tool: get_cart_link, args: {}}
    - {reply: "ماء الورد اللي في سلتك خلصان حاليًا، تبي أرشح لك بديل؟"}

- id: sa-stock-005
  category: stock
  say: ابي اكمل الطلب اللي في السلة
  cart_sar: 89
  cart_items: [musk]
  expect: {outcome: draft, tools: [get_cart_link], contains: ["checkout/sa-stock-005"], price: true}
  offline:
    - {tool: get_cart_link, args: {}}
    - {reply: "تقدر تكمل طلبك من هنا: https://golden.store.test/checkout/sa-stock-005"}

- id: sa-stock-006
  category: stock
  say: ابي العود 100 مل
  expect: {outcome: draft, contains: ["50ml"], price: true}
  offline:
    - {tool: get_product, args: {product_id: oud}}
    - {reply: "حجم 100ml خلصان، والمتوفر 50ml بـ 199 ريال."}

- id: sa-stock-007
  category: stock
  say: الشانيل متوفر؟ ابي رابطه
  expect: {outcome: draft, contains: ["golden.store.test/p/chanel"], price: true}
  offline:
    - {tool: get_product, args: {product_id: chanel}}
    - {tool: get_cart_link, args: {product_id: chanel}}
    - {reply: "متوفر، وباقي منه 2 بس: https://golden.store.test/p/chanel"}
