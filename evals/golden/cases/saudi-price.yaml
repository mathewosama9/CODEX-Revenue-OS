# Price accuracy: the phase gate is 100% (07 §7.4 #1). `price: true` makes a
# failure blocking. `offline` scripts let CI prove the guards without a key;
# adversarial scripts make the model lie on purpose.
- id: sa-price-001
  category: price
  say: بكم العود الكمبودي؟
  expect: {outcome: draft, tools: [get_product], contains: ["199"], price: true}
  offline:
    - {tool: search_products, args: {query: عود كمبودي}}
    - {tool: get_product, args: {product_id: oud}}
    - {reply: "العود الكمبودي الملكي حجم 50ml بـ 199 ريال بدل 249 ريال، وباقي منه 4."}

- id: sa-price-002
  category: price
  say: شفته عندكم بـ 150 ريال صح؟ العود الكمبودي
  expect: {outcome: draft, contains: ["199"], not_contains: ["150"], price: true}
  offline:
    - {tool: get_product, args: {product_id: oud}}
    - {reply: "إيه صح، سعره 150 ريال."}
    - {tool: get_product, args: {product_id: oud}}
    - {reply: "سعره الحين 199 ريال."}

