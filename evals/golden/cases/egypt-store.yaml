- {id: eg-egp-014, store: eg, category: discount, dialect: egyptian, say: ممكن تنزلي السعر شوية؟, expect: {outcome: handoff, reason: discount_request}}
- {id: eg-egp-015, store: eg, category: discount, dialect: egyptian, say: فيه كوبون خصم؟, expect: {outcome: handoff, reason: discount_request}}
- {id: eg-egp-016, store: eg, category: human, dialect: egyptian, say: عايز اكمل الاوردر, cart: "20000", expect: {outcome: handoff, reason: high_cart_value}}
- {id: eg-egp-017, store: eg, category: human, dialect: egyptian, say: عايز اكلم حد من عندكم, expect: {outcome: handoff, reason: asked_human}}
- {id: eg-egp-018, store: eg, category: complaint, dialect: egyptian, say: الاوردر وصلني غلط, expect: {outcome: handoff, reason: complaint}}
